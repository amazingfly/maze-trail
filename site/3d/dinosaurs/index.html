<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#122923">
  <link rel="icon" href="data:,">
  <title>Dinosaur lineup · Maze Trail</title>
  <link rel="stylesheet" href="./lineup.css">
</head>
<body>
  <main>
    <header><a href="../">Maze Trail</a><h1>Dinosaur lineup</h1></header>
    <div id="stage"><canvas aria-label="Animated Triceratops, Stegosaurus, T. rex, and Brachiosaurus"></canvas>
    <p id="status" role="status">Loading dinosaurs…</p></div>
    <div class="controls">
      <label>Scale <select id="age"><option value="baby">Hatchlings</option><option value="adult">Adults · 5×</option><option value="comparison">Adults and hatchlings</option></select></label>
      <label>Pose <select id="pose"><option value="idle">Idle</option><option value="walk">Walk cycle</option><option value="turn">Turning stride</option><option value="sit">Sit</option><option value="sniff">Sniff the air</option><option value="listen">Listening tilt</option><option value="gesture">Gestures</option><option value="call">Call or roar</option></select></label>
      <label>View <select id="angle"><option value="front">Front</option><option value="three">Three-quarter</option><option value="side">Side</option><option value="rear">Rear</option></select></label>
      <label>Dinosaur <select id="species"><option value="trike">Triceratops</option><option value="stego">Stegosaurus</option><option value="rex">T. rex</option><option value="longneck">Brachiosaurus</option></select></label>
      <button id="sound" type="button" disabled>Hear call</button>
    </div>
  </main>
  <script type="module" src="../dinosaur-lineup.mjs?v=5"></script>
</body>
</html>
