<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trace your printed maze or watch the solution come to life.">
  <meta name="theme-color" content="#fffaf0">
  <title>Maze Trail</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs?v=3"></script>
</head>
<body>
  <header class="masthead">
    <a class="wordmark" id="home" href="./" aria-label="Maze Trail home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 29V11h17v17H19V18h5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="29" r="2.4" fill="currentColor"/></svg>
      Maze Trail
    </a>
  </header>
  <main>
    <h1 id="maze-title">Maze Trail</h1>
    <div id="message" class="message" role="status">Getting your maze ready…</div>
    <div id="workspace" class="workspace" hidden>
      <section class="board" aria-label="Maze board">
        <svg id="maze" preserveAspectRatio="xMidYMid meet" role="group" tabindex="0" aria-label="Interactive maze" aria-describedby="maze-help"></svg>
        <p id="maze-help" class="sr-only">Drag the star to the flag or the yellow dot to the star. You can also tap a connected space or use the arrow keys.</p>
        <p id="status" class="sr-only" role="status"></p>
      </section>
      <section id="manual-controls" class="toolbar manual-controls" aria-label="Maze controls">
        <button type="button" id="reset" class="action reset" aria-label="Reset maze" title="Reset maze">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 16a16 16 0 1 1-3 15M13 7v10h10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span aria-hidden="true">Reset</span>
        </button>
        <button type="button" id="watch" class="action watch" aria-label="Watch solution" title="Watch solution">
          <svg viewBox="0 0 74 48" aria-hidden="true">
            <path d="M5 30V5h44v7m0 9v22H5v-5 M17 5v22H5 M28 43V19h-8 M39 5v7 M40 25v18" class="mini-walls"/>
            <path d="M4 34H19V16H50" class="mini-route" pathLength="100"/>
            <path d="m57 16 13 8-13 8Z" class="watch-play"/>
          </svg>
          <span aria-hidden="true">Watch</span>
        </button>
      </section>
      <section id="solution-controls" class="toolbar solution-controls" aria-label="Solution controls" hidden>
        <div class="solution-actions">
          <button type="button" id="back" class="action" aria-label="Back to tracing" title="Back to tracing">
            <svg viewBox="0 0 40 40" aria-hidden="true"><path d="m19 9-11 11 11 11M8 20h24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" id="play" class="action playback" aria-label="Play solution" title="Play solution">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <path data-play-icon="play" d="m13 6 22 14-22 14Z" fill="currentColor"/>
              <path data-play-icon="pause" d="M13 9v22M27 9v22" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" hidden/>
              <path data-play-icon="replay" d="M12 12a13 13 0 1 1-4 13m4-21v9h9" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" hidden/>
              <path data-play-icon="reveal" d="M3 20s6-10 17-10 17 10 17 10-6 10-17 10S3 20 3 20Zm17-5a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z" fill="currentColor" fill-rule="evenodd" hidden/>
            </svg>
          </button>
          <button type="button" id="reveal" class="action" aria-label="Show full path" title="Show full path">
            <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M3 20s6-10 17-10 17 10 17 10-6 10-17 10S3 20 3 20Zm17-5a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z" fill="currentColor" fill-rule="evenodd"/></svg>
          </button>
        </div>
        <input type="range" id="progress" min="0" max="1000" value="0" aria-label="Solution progress" aria-valuetext="0 percent">
        <fieldset class="speed">
          <legend class="sr-only">Playback speed</legend>
          <label title="Slow">
            <input type="radio" name="speed" value="0.5" aria-label="Slow">
            <svg viewBox="0 0 44 32" aria-hidden="true"><path d="M5 22c0-7 4-13 11-13s11 6 11 13m-23 0h24l4-5c2-2 6 0 6 3v3h-5l-5 3H6m4-4-2 7m16-7 2 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </label>
          <label title="Normal">
            <input type="radio" name="speed" value="1" aria-label="Normal" checked>
            <svg viewBox="0 0 44 32" aria-hidden="true"><path d="M16 6c2 3 2 6 0 8l-5 5c-2 2-7-1-7-4s4-8 7-10c2-1 4-1 5 1Zm5 10 5-5c2-2 7 0 8 3 1 4-2 8-5 11-3 2-7 0-8-3-1-2-1-4 0-6Z" fill="currentColor"/></svg>
          </label>
          <label title="Fast">
            <input type="radio" name="speed" value="2" aria-label="Fast">
            <svg viewBox="0 0 44 32" aria-hidden="true"><path d="M5 24c0-5 5-8 11-8l5-3V5c0-3 4-3 5 0l2 7 3-5c2-3 6-1 4 2l-3 5c4 0 7 2 7 6l-6 3h-6l3 5H10l-5-4Zm-1-5-2-1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="18" r="1.4" fill="currentColor"/></svg>
          </label>
        </fieldset>
      </section>
    </div>
    <a id="demo-link" class="demo-link" hidden>Open the example maze</a>
    <noscript><p>Turn on JavaScript to play this maze.</p></noscript>
  </main>
</body>
</html>
